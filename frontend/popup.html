<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #fff;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .hint { font-size: 11px; color: #6b7280; margin-bottom: 14px; }
    
    #checkBtn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #checkBtn:hover { opacity: 0.9; }
    #checkBtn:disabled { background: #374151; cursor: wait; }
    
    #loading { display: none; text-align: center; padding: 24px; color: #6b7280; font-size: 12px; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #374151;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #result { display: none; margin-top: 14px; }
    
    .verdict-card {
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .verdict-apply {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(16, 185, 129, 0.15) 100%);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .verdict-skip {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(220, 38, 38, 0.15) 100%);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .verdict-text { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    .verdict-apply .verdict-text { color: #22c55e; }
    .verdict-skip .verdict-text { color: #ef4444; }
    .score-display { font-size: 36px; font-weight: 700; margin: 4px 0; }
    .verdict-apply .score-display { color: #4ade80; }
    .verdict-skip .score-display { color: #f87171; }
    .threshold-note { font-size: 10px; color: #6b7280; }
    
    /* Experience flag styling */
    .exp-flag {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .exp-flag.green {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .exp-flag.yellow {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #fde047;
    }
    .exp-flag.red {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
    .exp-flag.red::before {
      content: "🚫 ";
    }
    
    .info-grid { display: grid; gap: 6px; margin-bottom: 8px; }
    .info-row {
      background: rgba(255,255,255,0.03);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 2px solid #6366f1;
    }
    .info-label {
      font-size: 9px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .info-value { font-size: 11px; color: #e5e7eb; line-height: 1.4; }
    .info-row.qual { border-left-color: #22c55e; }
    .info-row.skills { border-left-color: #3b82f6; }
    
    .skills-box {
      font-size: 10px;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: none;
    }
    .skills-box.matched {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    .skills-box.missing {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    .skills-box strong { display: block; margin-bottom: 3px; }
    .skill-tag {
      display: inline-block;
      padding: 2px 5px;
      margin: 1px;
      border-radius: 3px;
      font-size: 9px;
      background: rgba(255,255,255,0.1);
    }
    
    .action-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 6px;
      padding: 10px;
    }
    .action-box .info-label { color: #a5b4fc; }
    .action-box .info-value { color: #c7d2fe; }
    
    #error {
      margin-top: 14px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>⚡</span>
    <h1>Job Match Scorer</h1>
  </div>
  <p class="hint">Select job description text on the page, then click analyze</p>
  
  <button id="checkBtn">🔍 Analyze Selected Text</button>
  
  <div id="loading">
    <div class="spinner"></div>
    Analyzing with AI...
  </div>
  
  <div id="result">
    <div class="verdict-card" id="verdictCard">
      <div class="verdict-text" id="verdictText">--</div>
      <div class="score-display" id="score">--%</div>
      <div class="threshold-note">60% threshold to apply</div>
    </div>
    
    <div class="exp-flag" id="expFlag"></div>
    
    <div class="info-grid">
      <div class="info-row qual">
        <div class="info-label">🎓 Qualification</div>
        <div class="info-value" id="qualMatch"></div>
      </div>
      <div class="info-row skills">
        <div class="info-label">💻 Skills</div>
        <div class="info-value" id="skillsMatch"></div>
      </div>
    </div>
    
    <div class="skills-box matched" id="matchedSkills"></div>
    <div class="skills-box missing" id="missingSkills"></div>
    
    <div class="action-box">
      <div class="info-label">💡 Action</div>
      <div class="info-value" id="actionText"></div>
    </div>
  </div>
  
  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
